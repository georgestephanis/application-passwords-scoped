name: PHPCS

on:
  push:
    paths:
      - "**/*.php"
      - ".phpcs.xml"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/phpcs.yml"
  pull_request:
    paths:
      - "**/*.php"
      - ".phpcs.xml"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/phpcs.yml"

jobs:
  phpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: ./vendor/bin/phpcs
